# Identity carried over from the pre-rewrite app (v0.12.x) so the installed
# "R3 Media Hub" auto-updates into this build: same appId means NSIS treats it
# as the same application (upgrades in place, removes the old install), and the
# matching package.json name keeps userData at %APPDATA%\r3v07v3r-media-hub so
# the existing media-hub.sqlite and settings carry over.
appId: za.co.r3v07v3r.mediahub
productName: R3 Media Hub
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Ships only via win.extraResources below (to resourcesPath/mpv) — this
  # exclusion stops the default files glob from ALSO pulling it into
  # app.asar.unpacked. That trap is well established here: the same mistake
  # with the old ffmpeg bundle put 137MB in each of two locations, and mpv.exe
  # is a single 114MB file, so it would be worse.
  - '!resources/mpv-win/**'
asarUnpack:
  - resources/**
  # koffi's loader resolves a real on-disk path, and the actual prebuilt
  # koffi.node ships in the separate @koromix/koffi-win32-x64 package.
  # electron-builder's smart unpack catches the .node on its own, but the
  # explicit entries remove the gamble.
  - node_modules/koffi/**
  - node_modules/@koromix/**
win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: R3-Media-Hub-${version}-Setup.${ext}
  # mpv is the playback engine (demux + decode + track switching +
  # subtitle rendering, all locally) — see mpv.ts's header for why a
  # <video> element could not do this. It is NOT committed; scripts/fetch-mpv.ts
  # populates resources/mpv-win on postinstall, so a build fails loudly here if
  # that step was skipped rather than silently shipping without a player.
  # Lands at process.resourcesPath/mpv/mpv.exe — see mpv.ts's findMpv().
  extraResources:
    - from: resources/mpv-win
      to: mpv
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: R3 Media Hub
  uninstallDisplayName: R3 Media Hub
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # Never distribute a macOS build that the platform cannot notarize. The
  # release environment must provide the Apple signing/notarization settings.
  notarize: true
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: R3v07v3R
  repo: r3v07v3r-media-hub
  # Draft, not release — release.yml's own final step un-drafts it once
  # every asset (installer, blockmap, latest.yml) has actually finished
  # uploading. A draft release doesn't appear in GitHub's "latest release"
  # query, which is exactly what electron-updater polls — so a client that
  # checks for updates while a build is still in flight sees the PREVIOUS
  # release as latest and simply finds no update yet, instead of finding
  # this one and 404ing on whichever asset hasn't uploaded yet. Confirmed
  # live: v1.0.77's release existed and was already "latest" for the ~3.5
  # minutes between its creation and latest.yml's upload finishing,
  # long enough for a real user's client to poll in that exact window.
  releaseType: draft
