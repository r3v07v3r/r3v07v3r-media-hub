name: Release

# Automates what was previously a manual step: build the Windows installer
# and publish it as a GitHub Release so electron-updater (see
# electron-builder.yml's `publish` block) actually has something newer to
# find. Runs on every push to main, but only builds/publishes when
# package.json's version doesn't already have a release — otherwise every
# ordinary code push (most of which don't bump the version) would attempt
# a duplicate release and fail on the second one.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check whether this version is already released
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Already released — skipping build."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      - name: Build
        if: steps.check.outputs.exists == 'false'
        run: npm run build

      # Created here rather than left for electron-builder to create
      # on-the-fly: electron-builder uploads the installer and its
      # .blockmap concurrently, and when the release doesn't exist yet each
      # upload independently races to create it — GitHub's API intermittently
      # rejects the loser of that race with a 422 ("Published releases must
      # have a valid tag") even though the tag it just created is real,
      # confirmed live on this workflow's first run. Pre-creating the release
      # (and its tag) as its own step means electron-builder always finds an
      # existing release to attach assets to instead of racing to create one.
      #
      # --draft: a published (non-draft) release is visible to
      # electron-updater the instant it exists, but its assets — the
      # installer, its .blockmap, and latest.yml, which electron-builder
      # uploads in that order — take the next several minutes of this job
      # to actually appear. Confirmed live: a real user's client polled
      # for updates in exactly that window and 404'd on latest.yml, which
      # genuinely did not exist yet even though the release itself already
      # did. Keeping it a draft until every asset is up (see "Publish
      # release" below) means a client checking mid-build sees the
      # PREVIOUS release as latest instead — no update found, not a 404.
      - name: Create GitHub release (draft)
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.check.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.check.outputs.version }}" \
            --notes "Automated build." \
            --draft

      - name: Build installer and upload assets to the draft
        if: steps.check.outputs.exists == 'false'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only now does the release (and its assets) become visible to
      # electron-updater — atomically, with everything already attached.
      - name: Publish release
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ steps.check.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --draft=false
