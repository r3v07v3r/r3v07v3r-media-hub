name: Preview

# Builds and publishes a Preview-channel release on every push to `preview`
# — the fast-iteration loop: merge, get a build, install it via the
# Preview channel toggle in Settings (see AboutUpdateSection.tsx, which
# flips electron-updater's `allowPrerelease` flag). Promoting a build to
# the Stable channel is a separate, manual step — see
# promote-to-stable.yml — never automatic from here.
#
# Versioning: package.json's committed version on `preview` is always a
# clean MAJOR.MINOR.PATCH — "the version currently in progress, to become
# the next Stable release." This workflow never commits to package.json;
# it only computes an EPHEMERAL build version, `<that version>-preview.N`
# (N = this workflow's own run number, so it's always strictly
# increasing), applies it to package.json in this checkout only, and
# publishes the build under that tag. The committed version on `preview`
# only ever moves when promote-to-stable.yml bumps it after a release, or
# when a MAJOR/MINOR bump is made by hand — this workflow only ever reads
# it, never writes it back.
on:
  push:
    branches: [preview]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Verification is part of this workflow, rather than an independent push
  # check, so no Preview release can publish from an unverified commit.
  verify:
    uses: ./.github/workflows/verify.yml

  # The r3-cache daemon ships with every app release — same repo, same
  # version, same release page — so the app can judge protocol
  # compatibility from the daemon's /api/ping version alone, and so the
  # daemon's future self-updater reads the very feed electron-updater
  # already uses. SEA executables embed their platform's Node, hence one
  # leg per OS rather than cross-compilation.
  daemon:
    needs: verify
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: r3-cache-win-x64.exe
          - os: ubuntu-latest
            artifact: r3-cache-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same formula as the preview job's version step — run_number is
      # shared across all jobs of one run, so both stamp identically.
      - name: Build daemon (bundle + self-contained executable)
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version")
          R3_CACHE_VERSION="${BASE}-preview.${{ github.run_number }}" node scripts/build-daemon.mjs --sea

      # The universal bundle is byte-identical from either leg; the Linux
      # leg is arbitrarily the one that contributes it, so the merged
      # download contains each file exactly once.
      - name: Drop the duplicate bundle (Windows leg)
        if: runner.os == 'Windows'
        shell: bash
        run: rm -f dist-daemon/r3-cache.cjs dist-daemon/r3-cache.cjs.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-${{ matrix.os }}
          path: dist-daemon/*
          retention-days: 3

  # run_number is only reused when a failed run of THIS SAME run is
  # re-run (GitHub keeps run_number, bumps run_attempt instead) — the
  # exists-check below exists for exactly that case, not for the ordinary
  # case (every fresh push gets a fresh, never-before-seen number).
  version:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Compute this build's Preview version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE=$(node -p "require('./package.json').version")
          VERSION="${BASE}-preview.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "v$VERSION already exists — skipping (this is a re-run)."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  # --prerelease is what actually puts this on the Preview channel —
  # electron-updater's allowPrerelease flag (Stable = false, Preview =
  # true) is the only thing that reads it, filtering which releases each
  # channel ever sees.
  release:
    needs: [verify, daemon, version]
    if: needs.version.outputs.exists == 'false'
    permissions:
      contents: write
    uses: ./.github/workflows/build-and-release.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.version }}
      target: ${{ github.sha }}
      notes: Automated Preview build.
      prerelease: true
      attach-daemon: true
