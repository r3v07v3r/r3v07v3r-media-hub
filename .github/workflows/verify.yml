name: Verify

on:
  pull_request: {}
  push:
    branches: [preview, stable]

permissions:
  contents: read

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      # The current upstream advisories are high severity with no available
      # fix. Still print the full audit and fail automatically if a critical
      # advisory is introduced.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  party-sync-worker:
    name: Party relay checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: party-sync-worker/package-lock.json
      - name: Install relay dependencies
        run: npm ci --prefix party-sync-worker
      - name: Typecheck relay
        run: npm run typecheck --prefix party-sync-worker
      # Wrangler's current development dependency tree has an upstream-only
      # high advisory. Keep it visible and fail if a critical issue appears.
      - name: Audit relay dependencies
        run: npm audit --prefix party-sync-worker --audit-level=critical
