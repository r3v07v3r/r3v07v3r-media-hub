name = "r3-party-sync"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# One Durable Object instance per party room (see src/room.ts). PartyRoom
# is a SQLite-backed class (see the migration below), which Cloudflare
# offers on the Workers Free plan within that plan's usage limits; the
# older key-value-backed Durable Objects are what need the Paid plan.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "PartyRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PartyRoom"]
