<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>R3 Media Hub</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!-- img-src allows image.tmdb.org: real poster/backdrop art resolved
         ahead of time into src/renderer/src/data/tmdbArtwork.generated.json
         (see lib/artwork) — see REMOTE_IMAGE_DOMAINS in
         lib/artwork/config.ts, which is the single source of truth this
         should stay in sync with if another remote provider is added.

         The media-hub backend integration adds three more img-src hosts —
         Simkl (simkl.in posters/fanart/episode stills), Kitsu (both
         kitsu.io, its legacy media host, and kitsu.app, the CDN Kitsu's
         API actually returns image URLs on today — anime art rendered as
         a blank tint-gradient fallback until kitsu.app was added here,
         since a CSP-blocked <img> fails silently with no console error),
         and Cinemeta/Stremio's addon CDN (images.metahub.space poster/
         background art) — all read straight off
         CatalogItem.poster/background/logo, never proxied.

         m.media-amazon.com is IMDb's own image CDN: Cinemeta's SEARCH
         hits (catalog:search, see main/media-hub/catalog.ts) carry their
         poster there rather than on metahub, and a search result the
         index did not already hold rendered as a blank tint gradient
         until it was added here — the same silent CSP failure kitsu.app
         went through above.

         media-src is 'self' only. Nothing in this page plays audio or
         video itself: playback is mpv in a native child window, subtitles
         are handed to mpv (sub-add), and seek-bar previews are <img>
         elements covered by img-src. The loopback playback proxy and the
         base64 VTT <track> src this directive once allowed are both gone. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://image.tmdb.org https://simkl.in https://*.simkl.in https://kitsu.io https://*.kitsu.io https://kitsu.app https://*.kitsu.app https://images.metahub.space https://*.metahub.space https://m.media-amazon.com; media-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
